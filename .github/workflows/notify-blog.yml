name: 通知博客重建

# 笔记更新时，调用博客仓库的 Gmeek 工作流，让「日日新」页面立刻重建。
# 依赖仓库 Secret：BLOG_ACTIONS_TOKEN
#   （fine-grained token，仅授予 russianqin/russianqin.github.io 的 Actions: Read and write）
# 若未配置该 Secret，本工作流会失败，但不影响笔记仓库本身。

on:
  push:
    branches: [master]
    paths:
      - "**/*.md"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog rebuild
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BLOG_ACTIONS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/russianqin/russianqin.github.io/actions/workflows/Gmeek.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "已通知博客重建"
